<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>PICS Omni-Extractor</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      width: 320px;
      margin: 0;
      padding: 0;
      background: #080c14;
      color: white;
    }
    .header {
      padding: 16px;
      border-bottom: 1px solid #1e293b;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .header h1 {
      margin: 0;
      font-size: 16px;
      font-weight: 600;
    }
    .badge {
      background: rgba(139, 92, 246, 0.2);
      color: #c4b5fd;
      border: 1px solid rgba(139, 92, 246, 0.3);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: bold;
      text-transform: uppercase;
    }
    .content {
      padding: 16px;
    }
    .status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding: 12px;
      background: rgba(30, 41, 59, 0.4);
      border: 1px solid rgba(30, 41, 59, 0.6);
      border-radius: 8px;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 8px #10b981;
    }
    .status-dot.inactive {
      background: #64748b;
      box-shadow: none;
    }
    .toggle {
      width: 36px;
      height: 20px;
      background: #8b5cf6;
      border-radius: 10px;
      position: relative;
      cursor: pointer;
    }
    .toggle::after {
      content: '';
      position: absolute;
      top: 2px;
      right: 2px;
      width: 16px;
      height: 16px;
      background: white;
      border-radius: 50%;
      transition: all 0.2s;
    }
    .btn {
      width: 100%;
      padding: 10px;
      background: rgba(139, 92, 246, 0.1);
      border: 1px solid rgba(139, 92, 246, 0.3);
      color: #c4b5fd;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.2s;
      margin-top: 8px;
    }
    .btn:hover {
      background: rgba(139, 92, 246, 0.2);
    }
  </style>
</head>
<body>
  <div class="header">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#8b5cf6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
    </svg>
    <div>
      <h1>Omni-Extractor</h1>
      <div style="font-size: 11px; color: #64748b; margin-top: 2px;">Zero-Friction Collector</div>
    </div>
    <span class="badge" style="margin-left: auto;">Active</span>
  </div>

  <div class="content">
    <div class="status-row">
      <div>
        <div style="font-size: 13px; font-weight: 500;">Network Interceptor</div>
        <div style="font-size: 11px; color: #64748b; margin-top: 2px;">LinkedIn & X (Twitter)</div>
      </div>
      <div class="toggle"></div>
    </div>

    <div class="status-row">
      <div>
        <div style="font-size: 13px; font-weight: 500;">IndexedDB Hook</div>
        <div style="font-size: 11px; color: #64748b; margin-top: 2px;">WhatsApp Web Local Storage</div>
      </div>
      <div class="toggle"></div>
    </div>

    <div class="status-row" style="margin-bottom: 20px;">
      <div>
        <div style="font-size: 13px; font-weight: 500;">PICS Intelligence API</div>
        <div style="font-size: 11px; color: #64748b; margin-top: 2px;">Connected</div>
      </div>
      <div class="status-dot"></div>
    </div>

    <button class="btn" id="force-sync">Force Sync Cookies to Vault</button>
  </div>
</body>
</html>
