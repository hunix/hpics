<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Content Security Policy. wasm-unsafe-eval required by tfjs / mediapipe;
         'unsafe-inline' on style required by Radix UI runtime styles.
         connect-src lists every origin the client may call directly. Server-
         side fetches (edge functions calling OpenAI, Tavily, Perplexity, etc.)
         are not constrained by CSP. -->
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      script-src 'self' 'wasm-unsafe-eval';
      worker-src 'self' blob:;
      style-src 'self' 'unsafe-inline';
      img-src 'self' data: blob: https:;
      font-src 'self' data:;
      connect-src 'self'
        https://*.supabase.co wss://*.supabase.co
        https://accounts.google.com https://oauth2.googleapis.com https://www.googleapis.com
        https://login.microsoftonline.com https://graph.microsoft.com
        https://api.openai.com https://api.anthropic.com
        https://api.tavily.com https://api.perplexity.ai
        https://api.huggingface.co https://*.huggingface.co
        https://cdn.jsdelivr.net https://*.hcaptcha.com https://*.cloudflareinsights.com;
      media-src 'self' blob:;
      object-src 'none';
      base-uri 'self';
      form-action 'self';
      frame-ancestors 'none';
    " />
    <!-- Viewport with safe area support for notched devices -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    
    <title>PICS - Personal Information Connection System</title>
    <meta name="description" content="Manage your personal and professional relationships with AI-powered insights, follow-up reminders, and communication tracking." />
    <meta name="author" content="PICS" />
    <meta name="keywords" content="CRM, relationship management, contacts, personal CRM, networking" />

    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#6366f1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PICS" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="PICS" />
    <meta name="msapplication-TileColor" content="#6366f1" />
    <meta name="msapplication-tap-highlight" content="no" />
    
    <!-- Samsung specific -->
    <meta name="samsung-mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />
    
    <!-- Prevent iOS from styling inputs -->
    <meta name="format-detection" content="telephone=no, date=no, email=no, address=no" />
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Icons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="192x192" href="/pwa-192x192.png" />
    
    <!-- Splash screens for iOS -->
    <link rel="apple-touch-startup-image" href="/pwa-512x512.png" />
    
    <!-- Open Graph -->
    <meta property="og:title" content="PICS - Personal Information Connection System" />
    <meta property="og:description" content="Manage your personal and professional relationships with AI-powered insights" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@PICS" />
    <meta name="twitter:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />
    
    <style>
      /* Prevent FOUC and handle safe areas */
      html {
        background-color: #0a0a0a;
      }
      @media (prefers-color-scheme: light) {
        html {
          background-color: #ffffff;
        }
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Register service worker
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((registration) => {
              console.log('SW registered:', registration.scope);
            })
            .catch((error) => {
              console.log('SW registration failed:', error);
            });
        });
      }
    </script>
  </body>
</html>
